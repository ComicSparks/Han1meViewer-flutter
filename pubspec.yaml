name: havf
description: "Han1meViewer - Flutter"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rust_lib_hvf:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  signals_flutter: ^7.1.0
  flutter_inappwebview: ^6.1.5
  desktop_webview_window: ^0.3.2
  better_player_plus: ^1.1.5
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.2.1
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  gal: ^2.3.3
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  app_links: ^7.0.0
  intl: ^0.20.2
  image_picker: ^1.2.3
  flutter_foreground_task: ^10.0.0
  screen_brightness: ^2.1.11
  volume_controller: ^3.5.0
  wakelock_plus: ^1.6.1
  url_launcher: ^6.3.2
  crypto: ^3.0.6
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/search_options/
    - assets/h_keyframes/
    - assets/report_reason.json
    - assets/icon/
